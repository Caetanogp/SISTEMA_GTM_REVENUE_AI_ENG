name: Eval gate

# Quality gate for the agent itself. A prompt, model, graph or retrieval change that degrades
# measured behaviour must not reach develop — that is the whole point of eval-driven development.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "packages/core/revops/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "evals/**"
      - "docs/requirements/PDF_TRACEABILITY.md"
      - "scripts/check_pdf_traceability.py"
      - "tests/unit/scripts/test_pdf_traceability.py"
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        default: all
        type: choice
        options: [all, lead_scoring, tool_selection]

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Offline eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Check PDF traceability
        run: python scripts/check_pdf_traceability.py

      - name: Run evals
        run: python -m evals.run --suite ${{ inputs.suite || 'all' }}

      - name: Enforce thresholds
        run: python -m evals.gate

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: evals/reports/*.json
          retention-days: 30
