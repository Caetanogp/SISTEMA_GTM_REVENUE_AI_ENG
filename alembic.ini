[alembic]
script_location = packages/core/revops/infrastructure/persistence/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted here - env.py reads DATABASE_URL from the
# environment (falling back to the local docker-compose default), the same variable every
# other adapter and CI use. A hardcoded URL here would drift from that.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
